# OmniComply Docker Compose
# Spins up all infrastructure services for local development.

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension — primary vector store + metadata
  # ---------------------------------------------------------------------------
  postgres:
    image: ankane/pgvector:latest
    container_name: omnicomply-postgres
    environment:
      POSTGRES_DB: omnicomply
      POSTGRES_USER: omnicomply
      POSTGRES_PASSWORD: omnicomply_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicomply -d omnicomply"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Celery broker, semantic cache, session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: omnicomply-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Neo4j — Knowledge graph for regulatory entity relationships
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: omnicomply-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_dev_password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OmniComply API — FastAPI application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnicomply-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./eval:/app/eval
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Celery Worker — Async document processing
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnicomply-celery
    command: celery -A src.api.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  neo4jdata:

