# ==============================================================================
# Nightly Evaluation Regression Suite — OmniComply
# Runs the full eval suite every night and flags regressions.
# ==============================================================================

name: Nightly Eval Regression

on:
  schedule:
    - cron: "0 3 * * *"  # 3:00 AM UTC daily
  workflow_dispatch:       # Allow manual trigger

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  issues: write

jobs:
  nightly-eval:
    name: "🌙 Nightly Regression Suite"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Download previous eval report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nightly-eval-report
          path: eval/reports/baseline/

      - name: Run nightly regression
        env:
          EVAL_FAITHFULNESS_THRESHOLD: "0.90"
          EVAL_RELEVANCY_THRESHOLD: "0.85"
          EVAL_CONTEXT_PRECISION_THRESHOLD: "0.80"
        run: python -m eval.pipelines.nightly_regression

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          path: eval/reports/outputs/
          retention-days: 90

      - name: Publish Step Summary & Notify on Regression
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'eval/reports/outputs/nightly_eval_report.json';
            const summaryPath = 'eval/reports/outputs/regression_summary.txt';

            let summaryText = '';
            if (fs.existsSync(summaryPath)) {
              summaryText = fs.readFileSync(summaryPath, 'utf8');
            }

            if (fs.existsSync(reportPath)) {
              try {
                const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                const f = (data.metric_averages.faithfulness * 100).toFixed(1);
                const r = (data.metric_averages.answer_relevancy * 100).toFixed(1);
                const p = (data.metric_averages.context_precision * 100).toFixed(1);
                const a = (data.metric_averages.regulatory_accuracy * 100).toFixed(1);

                await core.summary
                  .addHeading('🌙 Nightly Regression Evaluation Summary')
                  .addTable([
                    [{data: 'Metric', header: true}, {data: 'Score', header: true}, {data: 'Threshold', header: true}, {data: 'Status', header: true}],
                    ['Faithfulness', `${f}%`, '90.0%', data.metric_averages.faithfulness >= 0.90 ? '✅ PASS' : '❌ FAIL'],
                    ['Answer Relevancy', `${r}%`, '85.0%', data.metric_averages.answer_relevancy >= 0.85 ? '✅ PASS' : '❌ FAIL'],
                    ['Context Precision', `${p}%`, '80.0%', data.metric_averages.context_precision >= 0.80 ? '✅ PASS' : '❌ FAIL'],
                    ['Regulatory Accuracy', `${a}%`, '85.0%', data.metric_averages.regulatory_accuracy >= 0.85 ? '✅ PASS' : '❌ FAIL']
                  ])
                  .addRaw(`\n\n**Gate Status:** ${data.gate_passed ? '✅ PASSED' : '🚨 REGRESSION DETECTED'} | **Overall Pass Rate:** ${(data.overall_pass_rate * 100).toFixed(1)}% (${data.total_test_cases} test cases)\n`)
                  .write();
              } catch (e) {
                if (summaryText) {
                  await core.summary.addHeading('🌙 Nightly Regression Evaluation Summary').addCodeBlock(summaryText, 'text').write();
                }
              }
            } else if (summaryText) {
              await core.summary.addHeading('🌙 Nightly Regression Evaluation Summary').addCodeBlock(summaryText, 'text').write();
            }

            // When a regression is flagged and the job fails, attempt to create an issue
            const jobStatus = '${{ job.status }}';
            if (jobStatus === 'failure') {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🚨 Nightly Eval Regression Detected - ${new Date().toISOString().split('T')[0]}`,
                  body: `## Evaluation Regression Report\n\n\`\`\`\n${summaryText}\n\`\`\`\n\nPlease investigate the regression in RAG quality metrics.`,
                  labels: ['eval-regression', 'priority:high']
                });
                core.info('Successfully created regression tracking issue.');
              } catch (err) {
                core.warning(`Could not create GitHub issue (${err.message}). Ensure repository allows Actions write permissions under Settings -> Actions -> General -> Workflow permissions.`);
              }
            }
