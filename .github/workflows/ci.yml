# ==============================================================================
# CI Pipeline — OmniComply
# Runs lint, unit tests, and evaluation gate on every push/PR.
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint — Code quality checks
  # ---------------------------------------------------------------------------
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/ eval/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ eval/

  # ---------------------------------------------------------------------------
  # Test — Unit tests with coverage
  # ---------------------------------------------------------------------------
  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing \
            -m "not integration and not eval and not slow"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Eval Gate — Enforce production RAG quality thresholds
  # ---------------------------------------------------------------------------
  eval-gate:
    name: "📊 Eval Gate"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run evaluation gate
        env:
          EVAL_FAITHFULNESS_THRESHOLD: "0.90"
          EVAL_RELEVANCY_THRESHOLD: "0.85"
          EVAL_CONTEXT_PRECISION_THRESHOLD: "0.80"
        run: python -m eval.pipelines.ci_eval_gate --strict

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/outputs/
          retention-days: 30

      - name: Publish Step Summary Table
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval/reports/outputs/ci_eval_report.json';
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const f = (data.metric_averages.faithfulness * 100).toFixed(1);
              const r = (data.metric_averages.answer_relevancy * 100).toFixed(1);
              const p = (data.metric_averages.context_precision * 100).toFixed(1);
              const a = (data.metric_averages.regulatory_accuracy * 100).toFixed(1);

              await core.summary
                .addHeading('📊 Production RAG Quality Evaluation Gate')
                .addTable([
                  [{data: 'Metric', header: true}, {data: 'Score', header: true}, {data: 'Threshold', header: true}, {data: 'Status', header: true}],
                  ['Faithfulness', `${f}%`, '90.0%', data.metric_averages.faithfulness >= 0.90 ? '✅ PASS' : '❌ FAIL'],
                  ['Answer Relevancy', `${r}%`, '85.0%', data.metric_averages.answer_relevancy >= 0.85 ? '✅ PASS' : '❌ FAIL'],
                  ['Context Precision', `${p}%`, '80.0%', data.metric_averages.context_precision >= 0.80 ? '✅ PASS' : '❌ FAIL'],
                  ['Regulatory Accuracy', `${a}%`, '85.0%', data.metric_averages.regulatory_accuracy >= 0.85 ? '✅ PASS' : '❌ FAIL']
                ])
                .addRaw(`\n\n**Overall Pass Rate:** ${(data.overall_pass_rate * 100).toFixed(1)}% across ${data.total_test_cases} golden test cases.\n`)
                .write();
            }
